<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextOS | AI-Powered Organizational Context Platform</title>
    <meta name="description" content="Unified AI-powered meeting, email, task, decision, and organizational context management system." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-text-primary antialiased font-sans selection:bg-brand-DEFAULT selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script>
      window.global = window;
      window.addEventListener('error', function(e) {
        var err = document.createElement('div');
        err.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:9999;padding:20px;font-family:monospace;white-space:pre-wrap;';
        err.textContent = 'RUNTIME ERROR: ' + e.message + '\n' + e.filename + ':' + e.lineno + '\n\n' + (e.error ? e.error.stack : '');
        document.body.appendChild(err);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var err = document.createElement('div');
        err.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:9999;padding:20px;font-family:monospace;white-space:pre-wrap;';
        err.textContent = 'PROMISE REJECTION: ' + e.reason;
        document.body.appendChild(err);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
