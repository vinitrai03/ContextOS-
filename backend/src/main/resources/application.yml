server:
  port: ${PORT:8080}

spring:
  application:
    name: contextos-backend
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/contextos}
    username: ${SPRING_DATASOURCE_USERNAME:contextos}
    password: ${SPRING_DATASOURCE_PASSWORD:contextos_secret_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

app:
  demo-mode: ${APP_DEMO_MODE:true}
  jwt:
    secret: ${JWT_SECRET:super_secret_jwt_signing_key_contextos_capstone_2026_minimum_256_bits}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
    
  base-url: "http://localhost:5173"

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${LLM_MODEL:gpt-4o-mini}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
